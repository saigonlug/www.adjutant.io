th="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M-23 76 h46 v35 h-46 Z" stroke="#aeb9cd" stroke-width="1" fill="#18253d" stroke-linecap="round" stroke-linejoin="round" /><text x="0" y="101" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0" transform="translate(0 0) scale(-1 1)">03</text></g><text x="625" y="964" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0" transform="translate(1250 0) scale(-1 1)">CLIENT 3</text><path d="M805 710 L805 792" stroke="#ff3636" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="805" cy="713" rx="5" ry="3" stroke="#ff3636" fill="#111a2e" stroke-width="1.5" /><ellipse cx="805" cy="788" rx="5" ry="3" stroke="#ff3636" fill="#111a2e" stroke-width="1.5" /><g id="ballast-client-2" transform="translate(805 796) scale(0.9)"><path d="M-17 0 Q0 -6 17 0 L10 19 C17 36 43 61 47 96 C52 128 37 144 0 146 C-37 144 -52 128 -47 96 C-43 61 -17 36 -10 19 Z" stroke="#ff3636" stroke-width="2.8" fill="#251f31" stroke-linecap="round" stroke-linejoin="round" /><path d="M-14 16 Q0 22 14 16 M-13 21 Q0 27 13 21" stroke="#ff3636" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M11 21 q24 -17 28 -7 q0 12 -22 12 M-11 21 q-22 -12 -26 -3 q-2 10 22 9" stroke="#ff3636" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M-10 31 Q-24 52 -27 70 M10 31 Q24 52 27 70 M-34 113 Q-25 133 -4 136 M30 113 Q22 135 6 136" stroke="#ff3636" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M-23 76 h46 v35 h-46 Z" stroke="#aeb9cd" stroke-width="1" fill="#18253d" stroke-linecap="round" stroke-linejoin="round" /><text x="0" y="101" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0" transform="translate(0 0) scale(-1 1)">02</text></g><text x="805" y="964" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0" transform="translate(1610 0) scale(-1 1)">CLIENT 2</text><path d="M985 710 L985 792" stroke="#ff3636" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="985" cy="713" rx="5" ry="3" stroke="#ff3636" fill="#111a2e" stroke-width="1.5" /><ellipse cx="985" cy="788" rx="5" ry="3" stroke="#ff3636" fill="#111a2e" stroke-width="1.5" /><g id="ballast-client-1" transform="translate(985 796) scale(0.9)"><path d="M-17 0 Q0 -6 17 0 L10 19 C17 36 43 61 47 96 C52 128 37 144 0 146 C-37 144 -52 128 -47 96 C-43 61 -17 36 -10 19 Z" stroke="#ff3636" stroke-width="2.8" fill="#251f31" stroke-linecap="round" stroke-linejoin="round" /><path d="M-14 16 Q0 22 14 16 M-13 21 Q0 27 13 21" stroke="#ff3636" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M11 21 q24 -17 28 -7 q0 12 -22 12 M-11 21 q-22 -12 -26 -3 q-2 10 22 9" stroke="#ff3636" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M-10 31 Q-24 52 -27 70 M10 31 Q24 52 27 70 M-34 113 Q-25 133 -4 136 M30 113 Q22 135 6 136" stroke="#ff3636" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M-23 76 h46 v35 h-46 Z" stroke="#aeb9cd" stroke-width="1" fill="#18253d" stroke-linecap="round" stroke-linejoin="round" /><text x="0" y="101" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0" transform="translate(0 0) scale(-1 1)">01</text></g><text x="985" y="964" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0" transform="translate(1970 0) scale(-1 1)">CLIENT 1</text><text x="131" y="300" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#aeb9cd" text-anchor="middle" letter-spacing="2" transform="translate(262 0) scale(-1 1)">MORE SALES</text><path d="M131 481 L131 331" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M138.67080861766723 345.04132099024594 L131 331 L123.32919138233275 345.04132099024594" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="131" y="738" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#ff3636" text-anchor="middle" letter-spacing="1" transform="translate(262 0) scale(-1 1)">EVEN MORE PLATFORM</text><g id="platform-drag-arrow" transform="translate(-1279 0)"><path d="M1410 769 L1410 918" stroke="#ff3636" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M1402.3291913823327 903.9586790097541 L1410 918 L1417.6708086176673 903.9586790097541" stroke="#ff3636" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g></g><path d="M64 1000 L1536 1000" stroke="#34425d" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="64" y="1043" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#ffffff" text-anchor="start" letter-spacing="0">More revenue above. More rebuilds and maintenance below.</text><text x="64" y="1079" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#aeb9cd" text-anchor="start" letter-spacing="0">Clients 1–2: existing platforms. Client 3: projected next sale.</text><text x="1536" y="1079" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#aeb9cd" text-anchor="end" letter-spacing="0">Airship / accumulating ballast</text></svg><path d="M64 1240 L1536 1240" stroke="#34425d" stroke-width="1" fill="none" /><text x="64" y="1282" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#ff3636" letter-spacing="2" text-anchor="start">MY INTERVENTION</text><text x="64" y="1330" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="0" text-anchor="start">Rebuild the team</text><text x="64" y="1371.0" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#aeb9cd" letter-spacing="0" text-anchor="start">Hire strong engineers and align</text><text x="64" y="1401.8" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#aeb9cd" letter-spacing="0" text-anchor="start">product with engineering.</text><text x="568" y="1330" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="0" text-anchor="start">Consolidate the product</text><text x="568" y="1371.0" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#aeb9cd" letter-spacing="0" text-anchor="start">Build one reusable platform and unify</text><text x="568" y="1401.8" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#aeb9cd" letter-spacing="0" text-anchor="start">data for future clients.</text><text x="1072" y="1330" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="0" text-anchor="start">Keep existing clients live</text><text x="1072" y="1371.0" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#aeb9cd" letter-spacing="0" text-anchor="start">Preserve two-way compatibility</text><text x="1072" y="1401.8" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#aeb9cd" letter-spacing="0" text-anchor="start">between the shared product and</text><text x="1072" y="1432.6" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#aeb9cd" letter-spacing="0" text-anchor="start">existing platforms.</text><path d="M64 1461 L1536 1461" stroke="#34425d" stroke-width="1" fill="none" /><text x="64" y="1500" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#aeb9cd" letter-spacing="2" text-anchor="start">WHAT THIS ENABLED</text><text x="64" y="1548" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="0" text-anchor="start">Future sales add clients to one reusable product.</text><text x="64" y="1590.0" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#aeb9cd" letter-spacing="0" text-anchor="start">A path to scalable onboarding and comparable insight, with existing clients kept operating.</text><path d="M64 1640 L1536 1640" stroke="#34425d" stroke-width="1" fill="none" /><text x="64" y="1677" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#aeb9cd" letter-spacing="0" text-anchor="start">Ballast represents separate builds and maintenance. Clients 1–2 existed; Client 3 is a projected next sale.</text><text x="1536" y="1677" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#aeb9cd" letter-spacing="2" text-anchor="end">ADJUTANT</text></svg>