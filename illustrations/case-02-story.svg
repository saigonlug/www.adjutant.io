<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1700" viewBox="0 0 1600 1700" role="img" aria-labelledby="case-title case-description"><title id="case-title">Case 2: Mediocrity Trap</title><desc id="case-description">Every institution required a complex custom platform, making growth expensive. I helped rebuild the team and consolidate the product, preserving two-way compatibility while creating a path to scalable onboarding and comparable insight.</desc><rect width="1600" height="1700" fill="#111a2e" /><path d="M64 69 L98 69" stroke="#ff3636" stroke-width="4" fill="none" /><text x="116" y="77" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#aeb9cd" letter-spacing="2" text-anchor="start">CASE 02 / ENTERPRISE INSURANCE PLATFORMS</text><text x="1536" y="77" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#aeb9cd" letter-spacing="1" text-anchor="end">MEDIOCRITY TRAP</text><text x="64" y="145.0" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="0" text-anchor="start">Each new sale came with ANOTHER complete rebuild.</text><text x="64" y="198.0" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#aeb9cd" letter-spacing="0" text-anchor="start">Two enterprise clients already meant two separate platforms.</text><text x="64" y="232.0" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#aeb9cd" letter-spacing="0" text-anchor="start">Every new sale brought another costly build and a permanent maintenance obligation.</text><text x="64" y="320" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#aeb9cd" letter-spacing="1.5" text-anchor="start">WHAT REPEATED CUSTOM BUILDS WERE DOING TO GROWTH</text><svg x="0" y="390.0" width="1600" height="780" viewBox="0 210 1600 780" overflow="hidden" id="selected-artwork" data-source="ballast-2-02"><rect width="1600" height="1100" fill="#111a2e" /><text x="64" y="61" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#aeb9cd" text-anchor="start" letter-spacing="2">CASE 02 / BALLOONS &amp; BALLAST / 02</text><text x="64" y="133" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#ffffff" text-anchor="start" letter-spacing="0">New clients should lift your business.</text><text x="64" y="180" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#aeb9cd" text-anchor="start" letter-spacing="0">Every separate platform adds another weight.</text><g id="mirrored-airship" transform="translate(1600 0) scale(-1 1)"><path d="M1198 312 L1397 265 L1351 399 L1269 421 Z" stroke="#aeb9cd" stroke-width="2" fill="#18253d" stroke-linecap="round" stroke-linejoin="round" /><path d="M1190 488 L1384 540 L1351 414 L1269 391 Z" stroke="#aeb9cd" stroke-width="2" fill="#18253d" stroke-linecap="round" stroke-linejoin="round" /><path d="M1341 400 H1457 L1420 435 H1335" stroke="#aeb9cd" stroke-width="2" fill="#18253d" stroke-linecap="round" stroke-linejoin="round" /><path d="M218 414 C230 204 760 192 1035 263 C1160 294 1250 344 1362 414 C1250 484 1160 534 1035 565 C760 636 230 624 218 414 Z" stroke="#ffffff" stroke-width="3" fill="#18253d" stroke-linecap="round" stroke-linejoin="round" /><path d="M218 414 C445 242 963 256 1362 414 M218 414 C445 586 963 572 1362 414" stroke="#aeb9cd" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M218 414 C402 337 1080 337 1362 414 M218 414 C402 491 1080 491 1362 414" stroke="#34425d" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M433 246 Q343 414 433 582" stroke="#34425d" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M644 246 Q554 414 644 582" stroke="#34425d" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M861 246 Q771 414 861 582" stroke