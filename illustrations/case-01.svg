ill="#aeb9cd" text-anchor="start" letter-spacing="0">A lending platform used by major banks, moving US$ Billions in transaction annually</text><text x="64" y="1044.4" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#aeb9cd" text-anchor="start" letter-spacing="0">while accumulating corrupted financial records.</text><text x="64" y="1073.8" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#aeb9cd" text-anchor="start" letter-spacing="0">core migration, restore financial controls, and build the product and tech team to own the system.</text><path d="M72.4 1193 l4.199999999999999 4.8999999999999995 9.799999999999999 -12.6" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="1" stroke-linecap="round" stroke-linejoin="round" /><text x="101" y="1200" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#ffffff" text-anchor="start" letter-spacing="0">Restore financial controls · Migrate the core · Establish team ownership</text><path d="M64 1253 L1536 1253" fill="none" stroke="#34425d" stroke-width="1" opacity="1" stroke-linecap="round" stroke-linejoin="round" /><text x="64" y="1280" font-family="Consolas,monospace" font-size="12" font-weight="400" fill="#aeb9cd" text-anchor="start" letter-spacing="0">NARRATIVE EXPLORATION / ILLUSTRATIVE, NOT MEASURED</text><text x="1536" y="1280" font-family="Consolas,monospace" font-size="14" font-weight="400" fill="#aeb9cd" text-anchor="end" letter-spacing="2">ADJUTANT</text></svg>